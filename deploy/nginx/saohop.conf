# Nginx cho Sao Hợp trên VPS dùng chung. Đặt tại /etc/nginx/sites-available/saohop.conf
# Chỉ phục vụ đúng các tên miền của Sao Hợp; không ảnh hưởng các site khác trên máy.
# HTTPS: chạy certbot --nginx -d saohop.com -d www.saohop.com -d dev.saohop.com, certbot tự thêm phần SSL vào file này.

# Chung cho mọi location chuyển tiếp vào Next.js
map $http_upgrade $saohop_connection_upgrade {
    default upgrade;
    ""      "";
}

# ---------- Production: saohop.com -> PM2 saohop-prod (127.0.0.1:3101) ----------
server {
    listen 80;
    server_name saohop.com;

    client_max_body_size 1m;

    # Luận giải AI trả về dạng stream: tắt buffer để chữ hiện dần, cho phép trả lời lâu.
    location ~ ^/api/(reading|compat)$ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $saohop_connection_upgrade;
    }
}

# www.saohop.com -> saohop.com
server {
    listen 80;
    server_name www.saohop.com;
    return 301 https://saohop.com$request_uri;
}

# ---------- Test: dev.saohop.com -> PM2 saohop-staging (127.0.0.1:3102) ----------
server {
    listen 80;
    server_name dev.saohop.com;

    client_max_body_size 1m;

    # Có mật khẩu và chặn máy tìm kiếm. File mật khẩu tạo bằng lệnh trong deploy/README.md.
    auth_basic "Sao Hop dev";
    auth_basic_user_file /etc/nginx/.htpasswd-saohop-dev;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/api/(reading|compat)$ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $saohop_connection_upgrade;
    }
}
